<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - KI-Hub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <!-- Kopfzeile -->
  <header class="kopfzeile">
    <div class="kopfzeile-inhalt">
      <a href="/" class="logo-bereich">
        <img src="/assets/logo.svg" alt="GFOS Logo" class="logo-bild">
        <span class="logo-text">KI-Hub</span>
      </a>
      <nav class="tab-navigation">
        <a href="/" class="tab-link" id="admin-back-link">&#8592; Zurueck zur Hauptseite</a>
        <button class="sprach-wechsel" id="admin-language-button" type="button" title="Language switch">
          <span>EN</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Admin-App Container -->
  <div id="admin-app">
    <div class="login-container">
      <p class="leer-zustand-text" id="admin-loading-text">Wird geladen...</p>
    </div>
  </div>

  <!-- Admin-Script (ES Module) -->
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
