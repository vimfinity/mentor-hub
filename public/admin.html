<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#007d8f">
  <title>Admin - KI-Hub</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme-preference');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <main class="hauptinhalt">
    <div class="login-container">
      <div class="login-karte">
        <h1 class="login-titel">Admin</h1>
        <p class="leer-zustand-text">Weiterleitung zum Admin-Bereich...</p>
        <p class="sektion-beschreibung"><a href="/admin">/admin</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/admin-redirect.js"></script>
</body>
</html>
